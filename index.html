<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Random Number Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.5rem;
        }
        .description {
            color: #666;
            margin-bottom: 20px;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .input-box {
            flex: 1;
        }
        label {
            display: block;
            color: #555;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.85rem;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: scale(0.98);
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 12px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result-label {
            color: rgba(255,255,255,0.9);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        .result-number {
            color: white;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .info {
            margin-top: 20px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #666;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 Random Number Generator</h1>
        <p class="description">
            Alat untuk menghasilkan angka acak.<br>
            Cocok untuk kuis, undian, atau pemilihan acak.
        </p>
        
        <div class="input-group">
            <div class="input-box">
                <label for="min">Min</label>
                <input type="number" id="min" value="1" min="0">
            </div>
            <div class="input-box">
                <label for="max">Max</label>
                <input type="number" id="max" value="100" min="1">
            </div>
        </div>
        
        <button onclick="generateNumber()">🎯 Generate Angka Acak</button>
        
        <div class="result" id="result">
            <div class="result-label">Angka yang terpilih:</div>
            <div class="result-number" id="randomNumber">-</div>
        </div>
        
        <div class="info">
            💡 Masukkan angka minimum dan maksimum, lalu klik tombol untuk mendapatkan angka acak.
        </div>
    </div>

    <script>
        function generateNumber() {
            const min = parseInt(document.getElementById('min').value) || 0;
            const max = parseInt(document.getElementById('max').value) || 100;
            
            if (min >= max) {
                alert('Angka minimum harus lebih kecil dari angka maksimum!');
                return;
            }
            
            const randomNumber = Math.floor(Math.random() * (max - min + 1)) + min;
            
            const resultDiv = document.getElementById('result');
            const numberDisplay = document.getElementById('randomNumber');
            
            numberDisplay.innerText = randomNumber;
            resultDiv.classList.add('show');
        }
    </script>
</body>
</html>
